server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: ess-portal-backend
  
  datasource:
    url: jdbc:mysql://localhost:3306/ess_portal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: user@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  
  sql:
    init:
      mode: always
      schema-locations: file:../database/schema.sql
      data-locations: file:../database/seed_data.sql
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Custom Security and JWT Configurations
app:
  security:
    jwt:
      secret: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437
      expiration-ms: 86400000 # 24 Hours
      refresh-expiration-ms: 604800000 # 7 Days
  file-upload:
    dir: uploads
